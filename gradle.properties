org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
kotlin.stdlib.default.dependency=false

# Host app checkout the plugin is compiled against: exteraGram-Dev or AyuGram-4A.
# The variant must have been compiled there at least once.
host.dir=D:/ProJects/exteraGram-Dev
host.variant=fullAfatDebug

# Host libraries visible to the plugin code. "group:name" follows the version
# declared in the host build script, "group:name:version" pins it.
host.libs=androidx.core:core-ktx,com.google.android.material:material,com.exteragram.hook:hook-core

# Android SDK root. Empty: sdk.dir of the host local.properties, then ANDROID_HOME.
android.sdk.dir=

# InMemoryDexClassLoader needs Android 8.0.
dex.min.api=26
r8.version=9.5.23

# Python plugin and the string constant that receives the packed DEX.
plugin.path=D:/ProJects/exteraPlugins/zwyPlugins/no_forward_limit.plugin
plugin.dex.var=DEX_BASE64

# Device. Empty adb.path: platform-tools of the SDK, then PATH.
# adb.serial is only needed with several devices connected.
adb.path=
adb.serial=
devserver.port=42690
